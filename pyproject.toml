[project]
name = "claudestra"
version = "0.2.1"
description = "Orchestrate long-lived Claude Code sessions as your machines' staff, with a chain of command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Adityarup Laha", email = "me@adityaruplaha.me" }]
requires-python = ">=3.12"
keywords = ["claude", "claude-code", "agents", "sessions", "tmux", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = ["libtmux>=0.62,<0.63", "pyyaml>=6,<7", "questionary>=2.1,<3", "rich>=14", "typer>=0.27,<0.28"]

[project.urls]
Homepage = "https://github.com/adityaruplaha/claudestra"
Documentation = "https://github.com/adityaruplaha/claudestra#readme"
Issues = "https://github.com/adityaruplaha/claudestra/issues"
Privacy = "https://github.com/adityaruplaha/claudestra/blob/main/PRIVACY.md"

[project.scripts]
claudestra = "claudestra.cli:app"
clost = "claudestra.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "B", "UP", "SIM", "I"]
ignore = ["E501"]  # the formatter wraps code at 120; a long string or comment is left whole

[tool.ruff.lint.isort]
known-first-party = ["claudestra"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
