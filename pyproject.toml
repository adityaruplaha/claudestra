[project]
name = "claudestra"
version = "0.1.0"
description = "Run long-lived Claude Code sessions as your machines' staff, with a chain of command."
requires-python = ">=3.12"
dependencies = ["libtmux>=0.62,<0.63", "pyyaml>=6,<7", "questionary>=2.1,<3", "rich>=14", "typer>=0.27,<0.28"]

[project.scripts]
claudestra = "claudestra.cli:app"
clost = "claudestra.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "B", "UP", "SIM", "I"]
ignore = ["E501"]  # the formatter wraps code at 120; a long string or comment is left whole

[tool.ruff.lint.isort]
known-first-party = ["claudestra"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
