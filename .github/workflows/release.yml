name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The package, the plugin's manifest and the version its hooks install must all be the tag's.
      - name: The tag names the version in all three places
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "plugin/.claude-plugin/plugin.json": json.load(open("plugin/.claude-plugin/plugin.json"))["version"],
              "plugin/hooks/register.ts": re.search(r"export const VERSION = '([^']+)'", open("plugin/hooks/register.ts").read())[1],
          }
          wrong = {path: v for path, v in found.items() if v != tag}
          for path, v in wrong.items():
              print(f"::error file={path}::version {v}, but the tag is v{tag}")
          sys.exit(bool(wrong))
          PY

  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The commit history is the changelog; the notes list what was merged since the last release.
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
