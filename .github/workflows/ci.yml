name: CI

on:
  push:
    branches: ["**"] # a tag runs these through the release workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The runner tests drive a tmux server of their own.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `claude plugin test` runs the hooks module's tests offline and needs no login. Claude Code is
      # pinned, and bumped deliberately, since the testing kit the tests import comes with it.
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude plugin test plugin
